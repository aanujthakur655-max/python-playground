<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python Playground PRO - Real</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:15px}
textarea{width:95%;height:160px;background:#1e293b;color:#22c55e;padding:12px;border-radius:10px;font-size:15px;border:1px solid #334155}
button{background:#22c55e;color:black;padding:12px 25px;border:none;border-radius:8px;font-weight:bold;margin:8px;cursor:pointer}
#out{background:black;color:#22c55e;padding:15px;margin-top:15px;border-radius:10px;text-align:left;min-height:120px;white-space:pre-wrap;border:1px solid #334155}
select{padding:10px;border-radius:8px;width:95%;margin:10px;background:#1e293b;color:white}
h1{margin-bottom:5px}
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
</head>
<body>
<h1>🐍 Python Playground PRO</h1>
<p>Made by Anuj Thakur - REAL Compiler</p>

<select id="ex" onchange="loadEx()"><option>Select Example...</option><option>Hello World</option><option>Loop 1 to 10</option><option>Function</option><option>Calculator (Input)</option></select>
<br>
<textarea id="c">print("Hello Future!")
print("Welcome Anuj!")</textarea><br>
<button class="run" onclick="run()">▶ Run Code</button>
<button onclick="clr()">Clear</button>
<div id="out">Loading Python... Wait 5 sec first time</div>
<script>
let py;
let o=document.getElementById("out");
let ce=document.getElementById("c");
ce.value=localStorage.getItem("mycode")||ce.value;
(async()=>{py=await loadPyodide();o.innerText="✅ Python Ready! Ab code chalao";})();

function loadEx(){
 let v=document.getElementById("ex").value;
 if(v=="Hello World") ce.value='print("Hello Future!")\nprint("Welcome Anuj!")';
 if(v=="Loop 1 to 10") ce.value='for i in range(1,11):\n    print(f"{i}. Anuj Thakur")';
 if(v=="Function") ce.value='def greet(name):\n    return f"Hello {name}!"\n\nprint(greet("Anuj"))';
 if(v=="Calculator (Input)") ce.value='a=int(input("Pehla Number: "))\nb=int(input("Dusra Number: "))\nprint(f"Jod = {a+b}")\nprint(f"Guna = {a*b}")';
 localStorage.setItem("mycode",ce.value);
}
function clr(){o.innerText="Ready...";o.style.color="#22c55e";}
async function run(){
 let code=ce.value;
 localStorage.setItem("mycode",code);
 o.innerText="Running...";o.style.color="#22c55e";
 try{
  let codeToRun=`import sys, io\nsys.stdout=io.StringIO()\n${code}\nsys.stdout.getvalue()`;
  let result=await py.runPythonAsync(codeToRun);
  if(result.trim()=="") result="✅ Code executed (No print output)";
  o.innerText=result;
  o.style.color="#22c55e";
 }catch(e){
  o.style.color="#ef4444";
  o.innerText="❌ ERROR:\\n"+e.message;
 }
}
</script>
</body>
</html>
