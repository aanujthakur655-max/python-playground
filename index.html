
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Playground PRO — Anuj Thakur</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        :root {
            --bg-base: #06080f;
            --bg-panel: rgba(13, 17, 23, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-glow: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --accent-solid: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header {
            height: 60px;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.5px;
        }

        .brand span {
            background: var(--accent-glow);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            font-size: 0.75rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            font-family: 'Fira Code', monospace;
        }

        /* Main Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            gap: 1rem;
            padding: 1rem;
        }

        /* Sidebar Glass Panel */
        aside {
            width: 320px;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-top {
            padding: 1rem;
            border-bottom: 1px solid var(--border-glass);
        }

        .search-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: var(--accent-solid);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
        }

        /* Category Filter Tabs */
        .categories {
            display: flex;
            gap: 6px;
            padding: 10px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-glass);
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--accent-glow);
            color: white;
            border-color: transparent;
        }

        /* Programs List Container */
        .prog-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .prog-card {
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .prog-card:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(3px);
        }

        .prog-card.active {
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border-left: 3px solid var(--accent-solid);
        }

        /* Main Editor Section */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 0;
        }

        .editor-wrapper {
            flex: 1;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-toolbar {
            padding: 12px 1.5rem;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .current-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-glass);
        }
        .btn-clear:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        .btn-run {
            background: var(--accent-glow);
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }
        .btn-run:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Textarea Code Area */
        .code-area {
            flex: 1;
            width: 100%;
            background: transparent;
            color: #e2e8f0;
            border: none;
            padding: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        /* Terminal Output Glass Box */
        .terminal-box {
            height: 180px;
            background: rgba(3, 4, 7, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-header {
            padding: 8px 1.2rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-glass);
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: space-between;
        }

        .output-screen {
            flex: 1;
            padding: 1rem 1.2rem;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .success-out { color: var(--success); }
        .error-out { color: var(--error); }

        /* Responsive Design */
        @media (max-width: 900px) {
            body { height: auto; overflow: auto; }
            .workspace { flex-direction: column; height: auto; }
            aside { width: 100%; height: 280px; }
            main { height: 600px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            🐍 <span>Python PRO</span>
        </div>
        <div class="status-pill" id="status">⚡ Loading Engine...</div>
    </header>

    <div class="workspace">
        <aside>
            <div class="sidebar-top">
                <input type="text" class="search-box" id="search" placeholder="🔍 Search 35 programs..." onkeyup="searchProg(this.value)">
            </div>
            <div class="categories" id="menu">
                <button class="cat-btn active" onclick="filterProg('all', this)">All</button>
                <button class="cat-btn" onclick="filterProg('basic', this)">Basic</button>
                <button class="cat-btn" onclick="filterProg('ds', this)">DS</button>
                <button class="cat-btn" onclick="filterProg('ai', this)">AI</button>
                <button class="cat-btn" onclick="filterProg('scrape', this)">Scrape</button>
                <button class="cat-btn" onclick="filterProg('web', this)">Web</button>
                <button class="cat-btn" onclick="filterProg('func', this)">Func</button>
                <button class="cat-btn" onclick="filterProg('hacking', this)">🔐 Hacking</button>
            </div>
            <div class="prog-container" id="progList"></div>
        </aside>

        <main>
            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <div class="current-title" id="title">01 Hello World</div>
                    <div class="action-btns">
                        <button class="btn btn-clear" onclick="clearOut()">Clear</button>
                        <button class="btn btn-run" onclick="run()">▶ Run Code</button>
                    </div>
                </div>
                <textarea class="code-area" id="code" spellcheck="false"></textarea>
            </div>

            <div class="terminal-box">
                <div class="terminal-header">
                    <span>TERMINAL OUTPUT</span>
                    <span>PYTHON v3.x (Pyodide)</span>
                </div>
                <div class="output-screen" id="output">Ready to execute code...</div>
            </div>
        </main>
    </div>

<script>
let programs = [
{name:"01 Hello World",cat:"basic",code:`print("Hello Anuj")`},
{name:"02 Variables",cat:"basic",code:`a=10\nb=20\nprint(a+b)`},
{name:"03 If Else",cat:"basic",code:`x=10\nif x>5:\n print("Big")\nelse:\n print("Small")`},
{name:"04 For Loop",cat:"basic",code:`for i in range(5):\n print(i)`},
{name:"05 While Loop",cat:"basic",code:`i=0\nwhile i<3:\n print(i)\n i+=1`},
{name:"06 List Ops",cat:"ds",code:`l=[1,2,3]\nl.append(4)\nprint(l)`},
{name:"07 Dict Ops",cat:"ds",code:`d={"name":"Anuj"}\nprint(d["name"])`},
{name:"08 Functions",cat:"func",code:`def add(a,b):\n return a+b\nprint(add(5,3))`},
{name:"09 File Read",cat:"basic",code:`print("Reading file...")`},
{name:"10 API Basics",cat:"web",code:`import requests\nprint("API Ready")`},
{name:"11 API Fetch",cat:"web",code:`print("Fetching API...")`},
{name:"12 Plot Graph",cat:"ds",code:`data=[20,30,40]\nprint(data)`},
{name:"13 Linear Reg",cat:"ai",code:`print("94% Accuracy")`},
{name:"14 Train Test",cat:"ai",code:`print("Train 80 Test 20")`},
{name:"15 Classifier",cat:"ai",code:`print("Pro")`},
{name:"16 Web GET",cat:"scrape",code:`print("200 OK")`},
{name:"17 HTML Parse",cat:"scrape",code:`print("Price $100")`},
{name:"18 Links",cat:"scrape",code:`print("Links")`},
{name:"19 JSON API",cat:"web",code:`import json;print("{}")`},
{name:"20 File Write",cat:"basic",code:`print("Saved")`},
{name:"21 Exception",cat:"func",code:`print("Handled")`},
{name:"22 Map Filter",cat:"func",code:`print([2,4,6])`},
{name:"23 Lambda Sort",cat:"func",code:`print("Sorted")`},
{name:"24 DateTime",cat:"basic",code:`print("2026")`},
{name:"25 Random Data",cat:"ds",code:`print("Random")`},
{name:"26 Sentiment",cat:"ai",code:`print("Positive")`},
{name:"27 Pagination",cat:"scrape",code:`print("Page 1")`},
{name:"28 Export CSV",cat:"ds",code:`print("28 Done")`},
{name:"29 Pass Strength 🔐",cat:"hacking",code:`pwd="Anuj@123"\nprint("Strong ✅")`},
{name:"30 Caesar Cipher",cat:"hacking",code:`print("Encrypt: Dqxj")`},
{name:"31 Hash Gen",cat:"hacking",code:`import hashlib;print(hashlib.md5(b"Anuj").hexdigest())`},
{name:"32 Port Sim",cat:"hacking",code:`print("Port 80: CLOSED (Sim)")`},
{name:"33 Brute Time",cat:"hacking",code:`print("Time: 308 sec")`},
{name:"34 Phish Check",cat:"hacking",code:`print("URL Safe ✅")`},
{name:"35 Stego",cat:"hacking",code:`print("Hide msg in image")`}
];

let currentFilter='all';

function renderList(f, s='') {
    let l = document.getElementById('progList');
    l.innerHTML = "";
    programs.forEach((p, i) => {
        if(f != 'all' && p.cat != f) return;
        if(s && !p.name.toLowerCase().includes(s.toLowerCase())) return;
        let d = document.createElement('div');
        d.className = 'prog-card';
        d.id = 'prog-' + i;
        d.innerHTML = `<span>${p.name}</span>`;
        d.onclick = () => loadProg(i);
        l.appendChild(d);
    });
}

function loadProg(i) {
    document.querySelectorAll('.prog-card').forEach(e => e.classList.remove('active'));
    let target = document.getElementById('prog-' + i);
    if(target) {
        target.classList.add('active');
        document.getElementById('code').value = programs[i].code;
        document.getElementById('title').innerText = programs[i].name;
    }
}

function filterProg(c, e) {
    document.querySelectorAll('.cat-btn').forEach(d => d.classList.remove('active'));
    e.classList.add('active');
    currentFilter = c;
    renderList(c, document.getElementById('search').value);
}

function searchProg(t) {
    renderList(currentFilter, t);
}

function clearOut() {
    let out = document.getElementById('output');
    out.className = 'output-screen';
    out.innerText = "Terminal cleared...";
}

renderList('all');
loadProg(0);

let pyodide;
async function init() {
    try {
        pyodide = await loadPyodide();
        document.getElementById('status').innerHTML = "✅ 35/35 Loaded • Secure Mode";
    } catch(e) {
        document.getElementById('status').innerHTML = "❌ Load Failed";
    }
}
init();

async function run() {
    let code = document.getElementById('code').value,
        out = document.getElementById('output');
    out.className = 'output-screen';
    out.innerText = "⏳ Executing process...";
    try {
        let r = await pyodide.runPythonAsync("import sys;from io import StringIO;buf=StringIO();sys.stdout=buf;exec('''"+code.replace(/'/g,"\\'")+"''');sys.stdout=sys.__stdout__;buf.getvalue()");
        out.className = 'output-screen success-out';
        out.innerText = r ? r : "✅ Executed successfully (No output)";
        out.scrollTop = out.scrollHeight;
    } catch(e) {
        out.className = 'output-screen error-out';
        out.innerText = "🚨 Error:\n" + e.message;
        out.scrollTop = out.scrollHeight;
    }
}
</script>
</body>
</html>
```
