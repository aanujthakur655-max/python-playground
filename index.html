<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Playground PRO - Anuj</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Consolas,monospace}
body{background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}
.menu{width:280px;background:#010409;border-right:1px solid #30363d;padding:10px;overflow-y:auto}
.menu h3{color:#7c3aed;padding:10px 5px}
.menu div{padding:9px 10px;border-radius:6px;cursor:pointer;margin:3px 0;font-size:13px}
.menu div.active,.menu div:hover{background:#7c3aed;color:#fff}
.prog{padding:8px 10px;background:#161b22;margin:4px 0;border-radius:5px;cursor:pointer;font-size:12px;border-left:2px solid transparent}
.prog.active{border-left:3px solid #7c3aed;background:#1f242d;color:#fff}
.main{flex:1;display:flex;flex-direction:column}
.top{padding:12px;background:#010409;border-bottom:1px solid #30363d;display:flex;justify-content:space-between;align-items:center}
.main textarea{flex:1;background:#0d1117;color:#58a6ff;border:none;padding:15px;outline:none;font-size:14px;resize:none}
#output{height:200px;background:#010409;border-top:1px solid #30363d;padding:15px;overflow-y:auto;overflow-x:hidden;white-space:pre-wrap;font-size:13px;scroll-behavior:smooth}
button{background:#238636;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-weight:bold}
input{width:100%;padding:8px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#fff;margin:8px 0;outline:none}
.success-box{color:#3fb950} .error-box{color:#f85149}
</style>
</head>
<body>
<div class="menu">
<h3>🐍 PYTHON PRO</h3>
<div id="status" style="font-size:11px;color:#8b949e;padding:5px">Loading Pyodide...</div>
<input id="search" placeholder="Search 35 tools..." oninput="searchProg(this.value)">
<div class="active" onclick="filterProg('all',this)">All (35)</div>
<div onclick="filterProg('basic',this)">Basic</div>
<div onclick="filterProg('hacking',this)">Hacking 🔐</div>
<div onclick="filterProg('ai',this)">AI</div>
<div onclick="filterProg('web',this)">Web</div>
<div id="progList" style="margin-top:10px"></div>
</div>

<div class="main">
<div class="top">
<span id="title">Loading...</span>
<div><button onclick="clearOut()" style="background:#30363d;margin-right:6px">Clear</button><button onclick="run()">▶ RUN</button></div>
</div>
<textarea id="code"></textarea>
<div id="output">Ready... Select any tool from left menu</div>
</div>

<script>
let programs = [
{name:"01 Hello World",cat:"basic",code:`print("Hello Anuj")`},
{name:"02 Variables",cat:"basic",code:`a=10\nb=20\nprint(a+b)`},
{name:"03 If Else",cat:"basic",code:`x=10\nif x>5:\n print("Big")\nelse:\n print("Small")`},
{name:"04 For Loop",cat:"basic",code:`for i in range(5):\n print(i)`},
{name:"05 While Loop",cat:"basic",code:`i=0\nwhile i<3:\n print(i)\n i+=1`},
{name:"06 List Ops",cat:"ds",code:`l=[1,2,3]\nl.append(4)\nprint(l)`},
{name:"07 Dict Ops",cat:"ds",code:`d={"name":"Anuj"}\nprint(d["name"])`},
{name:"08 Functions",cat:"func",code:`def add(a,b):\n return a+b\nprint(add(5,3))`},
{name:"09 File Read",cat:"basic",code:`print("Reading file...")`},
{name:"10 API Basics",cat:"web",code:`import requests\nprint("API Ready")`},
{name:"11 API Fetch",cat:"web",code:`print("Fetching API...")`},
{name:"12 Plot Graph",cat:"ds",code:`data=[20,30,40]\nprint(data)`},
{name:"13 Linear Reg",cat:"ai",code:`print("94% Accuracy")`},
{name:"14 Train Test",cat:"ai",code:`print("Train 80 Test 20")`},
{name:"15 Classifier",cat:"ai",code:`print("Pro")`},
{name:"16 Web GET",cat:"scrape",code:`print("200 OK")`},
{name:"17 HTML Parse",cat:"scrape",code:`print("Price $100")`},
{name:"18 Links",cat:"scrape",code:`print("Links")`},
{name:"19 JSON API",cat:"web",code:`import json;print("{}")`},
{name:"20 File Write",cat:"basic",code:`print("Saved")`},
{name:"21 Exception",cat:"func",code:`print("Handled")`},
{name:"22 Map Filter",cat:"func",code:`print([2,4,6])`},
{name:"23 Lambda Sort",cat:"func",code:`print("Sorted")`},
{name:"24 DateTime",cat:"basic",code:`print("2026")`},
{name:"25 Random Data",cat:"ds",code:`print("Random")`},
{name:"26 Sentiment",cat:"ai",code:`print("Positive")`},
{name:"27 Pagination",cat:"scrape",code:`print("Page 1")`},
{name:"28 Export CSV",cat:"ds",code:`print("28 Done")`},
{name:"29 Pass Strength 🔐",cat:"hacking",code:`pwd="Anuj@123"\nprint("Strong ✅")`},
{name:"30 Caesar Cipher",cat:"hacking",code:`print("Encrypt: Dqxj")`},
{name:"31 Hash Gen",cat:"hacking",code:`import hashlib;print(hashlib.md5(b"Anuj").hexdigest())`},
{name:"32 Port Sim",cat:"hacking",code:`print("Port 80: CLOSED (Sim)")`},
{name:"33 Brute Time",cat:"hacking",code:`print("Time: 308 sec")`},
{name:"34 Phish Check",cat:"hacking",code:`print("URL Safe ✅")`},
{name:"35 Stego",cat:"hacking",code:`print("Hide msg in image")`},
];

let currentFilter='all';
function renderList(f,s=''){
let l=document.getElementById('progList');l.innerHTML="";
programs.forEach((p,i)=>{
if(f!='all'&&p.cat!=f)return;
if(s&&!p.name.toLowerCase().includes(s.toLowerCase()))return;
let d=document.createElement('div');d.className='prog';d.id='prog-'+i;d.innerText=p.name;d.onclick=()=>loadProg(i);l.appendChild(d);
});
}
function loadProg(i){
document.querySelectorAll('.prog').forEach(e=>e.classList.remove('active'));
document.getElementById('prog-'+i).classList.add('active');
document.getElementById('code').value=programs[i].code;
document.getElementById('title').innerText=programs[i].name;
let out=document.getElementById('output');
out.scrollTop = out.scrollHeight;
}
function filterProg(c,e){
document.querySelectorAll('.menu div').forEach(d=>d.classList.remove('active'));
e.classList.add('active');currentFilter=c;renderList(c,document.getElementById('search').value);
}
function searchProg(t){renderList(currentFilter,t);}
function clearOut(){
let out=document.getElementById('output');
out.innerText="Cleared...";
out.scrollTop = 0;
}
renderList('all');loadProg(0);
let pyodide;async function init(){try{pyodide=await loadPyodide();document.getElementById('status').innerHTML="✅ 35/35 loaded • Hacking Mode 🔐";}catch(e){document.getElementById('status').innerHTML="❌ Load failed";}}init();

async function run(){
 let code=document.getElementById('code').value,out=document.getElementById('output');
 out.innerText="⏳ Running...";
 out.scrollTop = out.scrollHeight;
 try{
  let r=await pyodide.runPythonAsync("import sys;from io import StringIO;buf=StringIO();sys.stdout=buf;exec('''"+code.replace(/'/g,"\\'")+"''');sys.stdout=sys.__stdout__;buf.getvalue()");
  out.className='success-box';out.innerText="✅ SUCCESS\n\n"+r;
  out.scrollTop = out.scrollHeight;
  setTimeout(()=>{ out.scrollTop = out.scrollHeight; }, 150);
 }catch(e){
  out.className='error-box';out.innerHTML="🚨 ERROR<br><br>❌ "+e.message;
  out.scrollTop = out.scrollHeight;
 }
}
</script></body></html>
